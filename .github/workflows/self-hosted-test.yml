name: "Distro Test"

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Build and publish distribution release images"
        required: false
        default: false
        type: boolean
      expected_commit:
        description: "Exact main commit expected for a release dispatch"
        required: false
        type: string

  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    branches:
      - "main"

  push:
    branches:
      - "main"

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: 0
  PYTHONUTF8: "1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ==========================================================================================
  # Release: Prepare Distribution Draft (Merged PRs)
  # ==========================================================================================

  prepare-release-distributions:
    name: "Prepare Release Distribution Draft"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      release-build: ${{ steps.release.outputs.release-id != '' }}

    steps:
      - name: "Checkout CI Scripts"
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: "Validate Release Dispatch"
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/ci/self-hosted-test.py validate-release-dispatch

      - name: "Prepare GitHub Release"
        id: release
        if: |
          (github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.release)) &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'nanvix/distro'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/self-hosted-test.py prepare-release

  # ==========================================================================================
  # Linux: Build, Unit Test & Smoke Test (GitHub-Hosted)
  # ==========================================================================================

  linux-build-test:
    name: "Linux Build & Test"
    needs: prepare-release-distributions
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          # OpenSSL carries optional upstream test submodules that are not part
          # of the distro build. Only materialize this repository's gitlinks.
          submodules: true

      - name: "Relocate Cargo State"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py relocate-cargo-state

      - name: "Enable KVM"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py setup-kvm

      - name: "Setup sccache"
        uses: Mozilla-Actions/sccache-action@v0.0.10
        with:
          version: "v0.10.0"

      - name: "Install Python Dependencies"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py install-python-dependencies

      - name: "Check Distro Tooling"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py check-distro-tooling

      - name: "Ensure Docker Daemon"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py ensure-docker-daemon

      - name: "Build"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py build

      - name: "Create Distribution Images"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py create-distribution-images

      - name: "Smoke Test BusyBox Distribution (KVM)"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py smoke-test-busybox

      - name: "Smoke Test Composed Distribution"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py smoke-test-composed

      - name: "Package Release Distribution Images"
        if: needs.prepare-release-distributions.outputs.release-build == 'true'
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py package-release-distributions

      - name: "Reclaim Build Space"
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py reclaim-build-space

      - name: "Test"
        shell: bash
        env:
          RUST_LOG: debug
        run: python3 scripts/ci/self-hosted-test.py test

      - name: "Stage Release Distribution Images"
        if: needs.prepare-release-distributions.outputs.release-build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release-distributions.outputs.release-id }}
        run: python3 scripts/ci/self-hosted-test.py stage-release-distributions

      - name: "Remove Relocated Cargo State"
        if: always()
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py remove-relocated-cargo-state

      - name: "Print sccache Statistics"
        if: always()
        shell: bash
        run: python3 scripts/ci/self-hosted-test.py print-sccache-statistics

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs-${{ github.event.pull_request.number ||
            github.run_number }}
          overwrite: "true"
          path: |
            nanvix/logs/
            nanvix/**/*.log
            nanvix/**/*.out
            nanvix/**/*.err
            build/dist/busybox/busybox-smoke.log
            build/dist/ci-composed/composed-smoke.log
            ci-logs/

  # ==========================================================================================
  # Publish: Distribution Images (Merged PRs)
  # ==========================================================================================

  publish-release-distributions:
    name: "Publish Release Distribution Images"
    needs: [ prepare-release-distributions, linux-build-test, windows-build-test ]
    if: needs.prepare-release-distributions.outputs.release-build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: "Checkout CI Scripts"
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: "Publish GitHub Release"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release-distributions.outputs.release-id }}
        run: python3 scripts/ci/self-hosted-test.py publish-release

  # ==========================================================================================
  # Windows: Build & Test (GitHub-Hosted)
  # ==========================================================================================

  windows-build-test:
    name: "Windows Build & Test (${{ matrix.build-type }})"
    needs: prepare-release-distributions
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - ${{ needs.prepare-release-distributions.outputs.release-build == 'true' &&
            'release' || 'debug' }}
        machine-type: [ microvm ]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: "Create Short Drive Mapping"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py create-short-drive-mapping

      - name: "Restore Directory Symlinks as Junctions"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py restore-directory-symlinks

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py install-rust-toolchain

      - name: "Setup Prerequisites"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py setup-prerequisites

      - name: "Isolate Cargo Home"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py isolate-cargo-home

      - name: "Setup sccache"
        uses: Mozilla-Actions/sccache-action@v0.0.10
        with:
          version: "v0.10.0"

      - name: "Install Python Dependencies"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py install-python-dependencies

      - name: "Check Distro Tooling"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py check-distro-tooling

      - name: "Build & Test Nanvix Core"
        shell: pwsh
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          TEST_LOG_LEVEL: ${{ matrix.build-type == 'release' && 'debug' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
        run: python .\scripts\ci\self-hosted-test.py build-test-nanvix-core

      - name: "Download Pinned Distribution Guests"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .\scripts\ci\self-hosted-test.py download-pinned-distribution-guests

      - name: "Create Distribution Images"
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py create-distribution-images

      - name: "Smoke Test BusyBox Distribution (WHP)"
        shell: pwsh
        env:
          RUST_LOG: debug
        run: python .\scripts\ci\self-hosted-test.py smoke-test-busybox

      - name: "Package Release Distribution Images"
        if: |
          matrix.build-type == 'release' &&
          needs.prepare-release-distributions.outputs.release-build == 'true'
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py package-release-distributions

      - name: "Stage Release Distribution Images"
        if: |
          matrix.build-type == 'release' &&
          needs.prepare-release-distributions.outputs.release-build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release-distributions.outputs.release-id }}
        run: python .\scripts\ci\self-hosted-test.py stage-release-distributions

      - name: "Print sccache Statistics"
        if: always()
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py print-sccache-statistics

      - name: "Remove Drive Mapping"
        if: always()
        shell: pwsh
        run: python .\scripts\ci\self-hosted-test.py remove-drive-mapping

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-logs-${{ github.event.pull_request.number ||
            github.run_number }}-${{ matrix.build-type }}-${{
            matrix.machine-type }}
          overwrite: "true"
          path: |
            nanvix/logs/
            nanvix/**/*.log
            nanvix/**/*.out
            nanvix/**/*.err
            build/dist/busybox/busybox-smoke.log
